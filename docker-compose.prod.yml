services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_OWNER:-ireneeee900119}/restaurantsdd-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    environment:
      DATABASE_WRITE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-restaurant}
      DATABASE_READ_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-restaurant}
      REDIS_URL: redis://redis:6379
      ORDER_MODE: async
      ORDER_WORKER_CONCURRENCY: ${ORDER_WORKER_CONCURRENCY:-4}
      MAX_ORDER_QUEUE_DEPTH: ${MAX_ORDER_QUEUE_DEPTH:-1000}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/${GHCR_OWNER:-ireneeee900119}/restaurantsdd-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:5173'
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    depends_on:
      - backend

volumes:
  pgdata:
