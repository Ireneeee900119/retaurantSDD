global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by: ['alertname', 'severity']
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: default-webhook
    webhook_configs:
      - url: 'http://host.docker.internal:9999/alerts'
        send_resolved: true

# Replace default-webhook with Slack, Discord, email, PagerDuty, or your incident
# platform when deploying. The local placeholder keeps Alertmanager runnable
# without committing secrets into the repository.
